    - name: markets
      description: Discover and compare the US markets where Landing has bookable inventory.
    - name: homes
      description: Fetch furnished apartments, their availability calendars, and flex tiers.
    - name: pricing
      description: Real anonymous quotes from the pricing engine that powers checkout.
    - name: policies
      description: Grounded answers to common Landing policy questions.
    - name: operations
      description: Service health.
- target: $.paths['/api/public/markets'].get
  update:
