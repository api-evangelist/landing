aid: landing
name: Landing
description: >-
  Landing rents fully-furnished apartments for flexible monthly, short-term, and open-ended
  (LandingFlex) stays across 250+ US markets, booked entirely online with no security deposit and
  24/7 local support. Landing operates one of the more complete agent-native API surfaces in
  proptech: a public, unauthenticated, read-only REST API and a public MCP server that expose the
  same nine capabilities — market discovery, filter vocabularies, apartment search, home detail with
  full availability calendars, LandingFlex commitment tiers, real anonymous quotes from the pricing
  engine that powers checkout, market statistics, and grounded policy answers. Discovery is wired
  end to end: an RFC 9727 api-catalog, an llms.txt agent guide, an OpenAPI 3.1 document and tool
  catalog generated from the live tool set, an agentskills.io index, schema.org JSON-LD, and a
  robots.txt that steers agents to the API instead of scraping. Reservations are not exposed —
  read tools return checkout links and a person completes payment on the website.
